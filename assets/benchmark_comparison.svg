<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="640" fill="url(#bg2)" rx="24"/>
  <rect width="1200" height="640" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="24"/>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <rect width="170" height="28" rx="14" fill="rgba(48,209,88,0.12)" stroke="rgba(48,209,88,0.3)" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#30D158"/>
    <text x="26" y="18" fill="#30D158" font-size="11" font-weight="600" letter-spacing="0.06em">EMPIRICAL RESULTS</text>

    <text x="0" y="60" fill="#FFFFFF" font-size="28" font-weight="700" letter-spacing="-0.02em">Head-to-Head Token &amp; Cost Performance</text>
    <text x="0" y="82" fill="#86868B" font-size="14" font-weight="400">Measured across 4 severe distributed systems and greenfield challenges.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(930, 68)">
    <rect x="0" y="0" width="10" height="10" rx="3" fill="#FF453A"/>
    <text x="18" y="9" fill="#86868B" font-size="12" font-weight="500">Baseline Agent</text>
    <rect x="120" y="0" width="10" height="10" rx="3" fill="#30D158"/>
    <text x="138" y="9" fill="#30D158" font-size="12" font-weight="600">Cheaper</text>
  </g>

  <!-- Benchmark Cards List -->
  <g transform="translate(60, 150)">

    <!-- Row 1: Split Brain 2PC -->
    <g transform="translate(0, 0)">
      <rect width="1080" height="100" rx="16" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Info -->
      <text x="24" y="38" fill="#FFFFFF" font-size="16" font-weight="600">Split-Brain 2PC &amp; Raft Consensus</text>
      <text x="24" y="60" fill="#86868B" font-size="12">15 services • 35,000-line log</text>
      <!-- Bars -->
      <text x="360" y="40" fill="#86868B" font-size="11" font-weight="500">Baseline</text>
      <rect x="420" y="32" width="380" height="8" rx="4" fill="#FF453A"/>
      <text x="815" y="40" fill="#FF453A" font-size="12" font-weight="600">771.8k ($0.85)</text>

      <text x="360" y="66" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="420" y="58" width="70" height="8" rx="4" fill="#30D158"/>
      <text x="500" y="66" fill="#30D158" font-size="12" font-weight="700">142.6k ($0.16)</text>
      <!-- Badge -->
      <rect x="940" y="28" width="115" height="44" rx="12" fill="rgba(48,209,88,0.12)" stroke="rgba(48,209,88,0.25)" stroke-width="1"/>
      <text x="968" y="56" fill="#30D158" font-size="18" font-weight="700">-81.5%</text>
    </g>

    <!-- Row 2: AresDB MVCC & Recovery -->
    <g transform="translate(0, 114)">
      <rect width="1080" height="100" rx="16" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Info -->
      <text x="24" y="38" fill="#FFFFFF" font-size="16" font-weight="600">AresDB MVCC &amp; Crash Recovery</text>
      <text x="24" y="60" fill="#86868B" font-size="12">WAL framing • B+Tree concurrency</text>
      <!-- Bars -->
      <text x="360" y="40" fill="#86868B" font-size="11" font-weight="500">Baseline</text>
      <rect x="420" y="32" width="290" height="8" rx="4" fill="#FF453A"/>
      <text x="725" y="40" fill="#FF453A" font-size="12" font-weight="600">329.4k ($0.36)</text>

      <text x="360" y="66" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="420" y="58" width="95" height="8" rx="4" fill="#30D158"/>
      <text x="525" y="66" fill="#30D158" font-size="12" font-weight="700">108.3k ($0.06)</text>
      <!-- Badge -->
      <rect x="940" y="28" width="115" height="44" rx="12" fill="rgba(41,151,255,0.12)" stroke="rgba(41,151,255,0.25)" stroke-width="1"/>
      <text x="968" y="56" fill="#2997FF" font-size="18" font-weight="700">-84.1%</text>
    </g>

    <!-- Row 3: HNSW Vector Search Engine -->
    <g transform="translate(0, 228)">
      <rect width="1080" height="100" rx="16" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Info -->
      <text x="24" y="38" fill="#FFFFFF" font-size="16" font-weight="600">HNSW Vector Search Engine</text>
      <text x="24" y="60" fill="#86868B" font-size="12">Multi-layer graph • CRC32 binary</text>
      <!-- Bars -->
      <text x="360" y="40" fill="#86868B" font-size="11" font-weight="500">Baseline</text>
      <rect x="420" y="32" width="300" height="8" rx="4" fill="#FF453A"/>
      <text x="735" y="40" fill="#FF453A" font-size="12" font-weight="600">341.2k ($0.22)</text>

      <text x="360" y="66" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="420" y="58" width="122" height="8" rx="4" fill="#30D158"/>
      <text x="552" y="66" fill="#30D158" font-size="12" font-weight="700">138.9k ($0.09)</text>
      <!-- Badge -->
      <rect x="940" y="28" width="115" height="44" rx="12" fill="rgba(191,90,242,0.12)" stroke="rgba(191,90,242,0.25)" stroke-width="1"/>
      <text x="968" y="56" fill="#BF5AF2" font-size="18" font-weight="700">-59.3%</text>
    </g>

    <!-- Row 4: Distributed Saga -->
    <g transform="translate(0, 342)">
      <rect width="1080" height="100" rx="16" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Info -->
      <text x="24" y="38" fill="#FFFFFF" font-size="16" font-weight="600">Distributed Saga Orchestrator</text>
      <text x="24" y="60" fill="#86868B" font-size="12">Compensating transaction deadlock</text>
      <!-- Bars -->
      <text x="360" y="40" fill="#86868B" font-size="11" font-weight="500">Baseline</text>
      <rect x="420" y="32" width="220" height="8" rx="4" fill="#FF453A"/>
      <text x="655" y="40" fill="#FF453A" font-size="12" font-weight="600">35.1k ($0.04)</text>

      <text x="360" y="66" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="420" y="58" width="50" height="8" rx="4" fill="#30D158"/>
      <text x="480" y="66" fill="#30D158" font-size="12" font-weight="700">7.8k ($0.01)</text>
      <!-- Badge -->
      <rect x="940" y="28" width="115" height="44" rx="12" fill="rgba(48,209,88,0.12)" stroke="rgba(48,209,88,0.25)" stroke-width="1"/>
      <text x="968" y="56" fill="#30D158" font-size="18" font-weight="700">-77.7%</text>
    </g>

  </g>
</svg>