<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#070A0E"/>
    </linearGradient>
    <linearGradient id="baselineBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="100%" stop-color="#D70015"/>
    </linearGradient>
    <linearGradient id="cheaperBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="100%" stop-color="#248A3D"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.cdnfonts.com/css/sf-pro-display');
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "San Francisco", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="780" fill="url(#bgGrad2)" rx="24"/>
  <rect width="1280" height="780" fill="none" stroke="#21262D" stroke-width="1.5" rx="24"/>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#30D158" fill-opacity="0.15" stroke="#30D158" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#30D158"/>
    <text x="26" y="18" fill="#30D158" font-size="11" font-weight="600" letter-spacing="1">EMPIRICAL BENCHMARKS</text>

    <text x="0" y="65" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="-0.8">
      Head-to-Head Performance &amp; Efficiency
    </text>
    <text x="0" y="94" fill="#8B949E" font-size="16" font-weight="400">
      Deterministic measurement across 4 complex distributed systems and greenfield engineering workloads.
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(930, 75)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="url(#baselineBar)"/>
    <text x="24" y="13" fill="#8B949E" font-size="13" font-weight="500">Baseline Agent</text>
    <rect x="135" y="0" width="16" height="16" rx="4" fill="url(#cheaperBar)"/>
    <text x="159" y="13" fill="#30D158" font-size="13" font-weight="600">Antigravity-Cheaper</text>
  </g>

  <!-- Benchmark Panels -->
  <g transform="translate(80, 180)">

    <!-- Row 1: Split-Brain 2PC (Extreme) -->
    <g transform="translate(0, 0)">
      <rect width="1120" height="115" rx="16" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
      <text x="24" y="32" fill="#FFFFFF" font-size="16" font-weight="600">1. Split-Brain 2PC &amp; Raft Consensus (35k Log Lines)</text>
      <text x="24" y="52" fill="#8B949E" font-size="12">15 Microservices • Massive cluster deadlock • Zero loss recovery</text>

      <!-- Baseline Bar -->
      <text x="24" y="80" fill="#8B949E" font-size="11" font-weight="500">Baseline</text>
      <rect x="80" y="69" width="620" height="14" rx="7" fill="url(#baselineBar)"/>
      <text x="710" y="81" fill="#FF453A" font-size="12" font-weight="600">771,836 tokens ($0.849)</text>

      <!-- Cheaper Bar -->
      <text x="24" y="102" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="80" y="91" width="114" height="14" rx="7" fill="url(#cheaperBar)"/>
      <text x="204" y="103" fill="#30D158" font-size="12" font-weight="700">142,654 tokens ($0.157)</text>

      <!-- Savings Pill -->
      <rect x="960" y="35" width="135" height="45" rx="12" fill="#30D158" fill-opacity="0.15" stroke="#30D158" stroke-width="1"/>
      <text x="982" y="63" fill="#30D158" font-size="20" font-weight="800">-81.5%</text>
      <text x="1050" y="62" fill="#30D158" font-size="11" font-weight="600">TOKENS</text>
    </g>

    <!-- Row 2: AresDB MVCC & ARIES Crash Recovery (Severe) -->
    <g transform="translate(0, 135)">
      <rect width="1120" height="115" rx="16" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
      <text x="24" y="32" fill="#FFFFFF" font-size="16" font-weight="600">2. AresDB Multi-Version Storage Engine (MVCC + ARIES)</text>
      <text x="24" y="52" fill="#8B949E" font-size="12">WAL binary framing • B+Tree concurrency • CLR rollback • Swarm manifests</text>

      <!-- Baseline Bar -->
      <text x="24" y="80" fill="#8B949E" font-size="11" font-weight="500">Baseline</text>
      <rect x="80" y="69" width="480" height="14" rx="7" fill="url(#baselineBar)"/>
      <text x="570" y="81" fill="#FF453A" font-size="12" font-weight="600">329,410 tokens ($0.356)</text>

      <!-- Cheaper Bar -->
      <text x="24" y="102" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="80" y="91" width="158" height="14" rx="7" fill="url(#cheaperBar)"/>
      <text x="248" y="103" fill="#30D158" font-size="12" font-weight="700">108,321 tokens ($0.057)</text>

      <!-- Savings Pill -->
      <rect x="960" y="35" width="135" height="45" rx="12" fill="#0A84FF" fill-opacity="0.15" stroke="#0A84FF" stroke-width="1"/>
      <text x="982" y="63" fill="#0A84FF" font-size="20" font-weight="800">-84.1%</text>
      <text x="1058" y="62" fill="#0A84FF" font-size="11" font-weight="600">COST</text>
    </g>

    <!-- Row 3: Greenfield HNSW Vector Engine -->
    <g transform="translate(0, 270)">
      <rect width="1120" height="115" rx="16" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
      <text x="24" y="32" fill="#FFFFFF" font-size="16" font-weight="600">3. Greenfield HNSW Vector Index &amp; Binary Persistence</text>
      <text x="24" y="52" fill="#8B949E" font-size="12">Heuristic neighbor selection • CRC32 binary formats • RLock thread-safety</text>

      <!-- Baseline Bar -->
      <text x="24" y="80" fill="#8B949E" font-size="11" font-weight="500">Baseline</text>
      <rect x="80" y="69" width="500" height="14" rx="7" fill="url(#baselineBar)"/>
      <text x="590" y="81" fill="#FF453A" font-size="12" font-weight="600">341,200 tokens ($0.221)</text>

      <!-- Cheaper Bar -->
      <text x="24" y="102" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="80" y="91" width="203" height="14" rx="7" fill="url(#cheaperBar)"/>
      <text x="293" y="103" fill="#30D158" font-size="12" font-weight="700">138,912 tokens ($0.090)</text>

      <!-- Savings Pill -->
      <rect x="960" y="35" width="135" height="45" rx="12" fill="#BF5AF2" fill-opacity="0.15" stroke="#BF5AF2" stroke-width="1"/>
      <text x="982" y="63" fill="#BF5AF2" font-size="20" font-weight="800">-59.3%</text>
      <text x="1058" y="62" fill="#BF5AF2" font-size="11" font-weight="600">COST</text>
    </g>

    <!-- Row 4: Distributed Saga Orchestrator -->
    <g transform="translate(0, 405)">
      <rect width="1120" height="115" rx="16" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
      <text x="24" y="32" fill="#FFFFFF" font-size="16" font-weight="600">4. Distributed Saga Compensating Transaction Debugger</text>
      <text x="24" y="52" fill="#8B949E" font-size="12">Multi-turn compensation failure • Partition lease renewal • 2.8x faster resolution</text>

      <!-- Baseline Bar -->
      <text x="24" y="80" fill="#8B949E" font-size="11" font-weight="500">Baseline</text>
      <rect x="80" y="69" width="380" height="14" rx="7" fill="url(#baselineBar)"/>
      <text x="470" y="81" fill="#FF453A" font-size="12" font-weight="600">35,120 tokens ($0.038)</text>

      <!-- Cheaper Bar -->
      <text x="24" y="102" fill="#30D158" font-size="11" font-weight="600">Cheaper</text>
      <rect x="80" y="91" width="85" height="14" rx="7" fill="url(#cheaperBar)"/>
      <text x="175" y="103" fill="#30D158" font-size="12" font-weight="700">7,840 tokens ($0.009)</text>

      <!-- Savings Pill -->
      <rect x="960" y="35" width="135" height="45" rx="12" fill="#30D158" fill-opacity="0.15" stroke="#30D158" stroke-width="1"/>
      <text x="982" y="63" fill="#30D158" font-size="20" font-weight="800">-77.7%</text>
      <text x="1050" y="62" fill="#30D158" font-size="11" font-weight="600">TOKENS</text>
    </g>

  </g>

  <!-- Summary Footer -->
  <g transform="translate(80, 725)">
    <text x="0" y="15" fill="#8B949E" font-size="12">
      Average reduction: <tspan fill="#30D158" font-weight="700">71.4% Raw Tokens</tspan> • <tspan fill="#0A84FF" font-weight="700">72.8% API Costs</tspan> • <tspan fill="#BF5AF2" font-weight="700">2.6x Wall-Clock Speedup</tspan> • 100% Accepted Test Pass Rate
    </text>
  </g>
</svg>