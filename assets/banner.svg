<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#070A0E"/>
    </linearGradient>
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="100%" stop-color="#248A3D"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E1E4EA"/>
      <stop offset="100%" stop-color="#8E9AA8"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="meshGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="meshGlow2" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#30D158" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.cdnfonts.com/css/sf-pro-display');
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "San Francisco", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="480" fill="url(#bgGrad)" rx="24"/>
  <rect width="1280" height="480" fill="url(#meshGlow)" rx="24"/>
  <rect width="1280" height="480" fill="url(#meshGlow2)" rx="24"/>
  <rect width="1280" height="480" fill="none" stroke="#21262D" stroke-width="1.5" rx="24"/>

  <!-- Decorative Grid -->
  <g opacity="0.12" stroke="#8E9AA8" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="480" stroke-dasharray="4 8"/>
    <line x1="360" y1="0" x2="360" y2="480" stroke-dasharray="4 8"/>
    <line x1="640" y1="0" x2="640" y2="480" stroke-dasharray="4 8"/>
    <line x1="920" y1="0" x2="920" y2="480" stroke-dasharray="4 8"/>
    <line x1="1160" y1="0" x2="1160" y2="480" stroke-dasharray="4 8"/>
    <line x1="0" y1="120" x2="1280" y2="120" stroke-dasharray="4 8"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke-dasharray="4 8"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke-dasharray="4 8"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(80, 70)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#0A84FF" fill-opacity="0.15" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#0A84FF"/>
    <text x="30" y="21" fill="#58A6FF" font-size="12" font-weight="600" letter-spacing="1.2">GOOGLE ANTIGRAVITY ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="url(#textGrad)" font-size="54" font-weight="800" letter-spacing="-1.5">
      Antigravity Cheaper
    </text>

    <!-- Subtitle -->
    <text x="0" y="138" fill="#8B949E" font-size="20" font-weight="400" letter-spacing="-0.2">
      High-Precision Token Economization &amp; Cognitive Scaffolding for Gemini Agents
    </text>

    <!-- Metric Cards in macOS Style -->
    <g transform="translate(0, 185)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="255" height="110" rx="16" fill="#161B22" fill-opacity="0.85" stroke="#30363D" stroke-width="1"/>
        <text x="20" y="32" fill="#8B949E" font-size="12" font-weight="600" letter-spacing="0.5">RAW TOKEN REDUCTION</text>
        <text x="20" y="72" fill="#30D158" font-size="36" font-weight="700" letter-spacing="-1">-81.5%</text>
        <text x="20" y="94" fill="#6E7681" font-size="12" font-weight="400">Up to 629k tokens saved / run</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(275, 0)">
        <rect width="255" height="110" rx="16" fill="#161B22" fill-opacity="0.85" stroke="#30363D" stroke-width="1"/>
        <text x="20" y="32" fill="#8B949E" font-size="12" font-weight="600" letter-spacing="0.5">API COST SAVINGS</text>
        <text x="20" y="72" fill="#0A84FF" font-size="36" font-weight="700" letter-spacing="-1">-84.1%</text>
        <text x="20" y="94" fill="#6E7681" font-size="12" font-weight="400">Gemini Context Caching locked</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(550, 0)">
        <rect width="255" height="110" rx="16" fill="#161B22" fill-opacity="0.85" stroke="#30363D" stroke-width="1"/>
        <text x="20" y="32" fill="#8B949E" font-size="12" font-weight="600" letter-spacing="0.5">WALL-CLOCK SPEEDUP</text>
        <text x="20" y="72" fill="#BF5AF2" font-size="36" font-weight="700" letter-spacing="-1">3.0x</text>
        <text x="20" y="94" fill="#6E7681" font-size="12" font-weight="400">Zero context re-parsing lag</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(825, 0)">
        <rect width="295" height="110" rx="16" fill="#161B22" fill-opacity="0.85" stroke="#30363D" stroke-width="1"/>
        <text x="20" y="32" fill="#8B949E" font-size="12" font-weight="600" letter-spacing="0.5">ZERO REASONING LOSS</text>
        <text x="20" y="72" fill="#FF9F0A" font-size="36" font-weight="700" letter-spacing="-1">100%</text>
        <text x="20" y="94" fill="#6E7681" font-size="12" font-weight="400">Verified on SWE &amp; ARIES tests</text>
      </g>
    </g>

    <!-- Footer pill badges -->
    <g transform="translate(0, 325)">
      <g transform="translate(0, 0)">
        <rect width="180" height="26" rx="13" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" fill="#C9D1D9" font-size="11" font-weight="500">⚡ FastMCP Symbol Server</text>
      </g>
      <g transform="translate(192, 0)">
        <rect width="185" height="26" rx="13" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" fill="#C9D1D9" font-size="11" font-weight="500">🔒 Prefix-Lock Cache Layer</text>
      </g>
      <g transform="translate(389, 0)">
        <rect width="195" height="26" rx="13" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" fill="#C9D1D9" font-size="11" font-weight="500">🌲 PageRank AST RepoMap</text>
      </g>
      <g transform="translate(596, 0)">
        <rect width="185" height="26" rx="13" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" fill="#C9D1D9" font-size="11" font-weight="500">🧠 Zero-Tax FTS5 Memory</text>
      </g>
      <g transform="translate(793, 0)">
        <rect width="185" height="26" rx="13" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" fill="#C9D1D9" font-size="11" font-weight="500">🛡️ Gatekeeper Verification</text>
      </g>
    </g>
  </g>
</svg>