<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <style>
      .hdr-term { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #475569; }
      .main-title { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 44px; font-weight: 800; fill: #0f172a; letter-spacing: -0.02em; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 500; fill: #334155; }
      .pill-text { font-family: ui-monospace, monospace; font-size: 15px; font-weight: 700; fill: #1e40af; }
    </style>
  </defs>

  <!-- Outer Card with thick technical border -->
  <rect x="6" y="6" width="948" height="248" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Top Terminal Bar -->
  <rect x="20" y="20" width="920" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.75"/>
  <circle cx="44" cy="41" r="7" fill="#ef4444"/>
  <circle cx="68" cy="41" r="7" fill="#f59e0b"/>
  <circle cx="92" cy="41" r="7" fill="#10b981"/>
  <text x="122" y="46" class="hdr-term">antigravity-cheaper / context-guard-engine</text>

  <!-- Main Title -->
  <text x="36" y="116" class="main-title">Antigravity-Cheaper</text>
  <text x="36" y="152" class="sub-title">Token economization &amp; FastMCP symbol server for Google Antigravity agents.</text>

  <!-- Technical Pills (Large & Legible) -->
  <g transform="translate(36, 178)">
    <rect width="205" height="42" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="18" y="27" class="pill-text">AST Skeletons</text>

    <g transform="translate(220, 0)">
      <rect width="220" height="42" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <text x="18" y="27" class="pill-text">PageRank Symbol Map</text>
    </g>

    <g transform="translate(455, 0)">
      <rect width="205" height="42" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <text x="18" y="27" class="pill-text">FastMCP stdio Server</text>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="42" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <text x="18" y="27" class="pill-text">Prefix Cache Lock (&gt;85%)</text>
    </g>
  </g>
</svg>
