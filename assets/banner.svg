<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg)" rx="24"/>
  <rect width="1200" height="420" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="24"/>

  <!-- Category Pill -->
  <g transform="translate(60, 48)">
    <rect width="176" height="28" rx="14" fill="rgba(41,151,255,0.12)" stroke="rgba(41,151,255,0.3)" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#2997FF"/>
    <text x="26" y="18" fill="#2997FF" font-size="11" font-weight="600" letter-spacing="0.06em">TOKEN OPTIMIZATION</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="122" fill="#FFFFFF" font-size="44" font-weight="700" letter-spacing="-0.03em">Antigravity Cheaper</text>
  <text x="60" y="156" fill="#86868B" font-size="17" font-weight="400" letter-spacing="-0.01em">High-precision token economization &amp; cognitive scaffolding for Google Antigravity.</text>

  <!-- 3 Simple Apple Stat Cards -->
  <g transform="translate(60, 200)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="340" height="160" rx="18" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="28" y="44" fill="#86868B" font-size="12" font-weight="600" letter-spacing="0.08em">RAW TOKENS</text>
      <text x="28" y="98" fill="#30D158" font-size="48" font-weight="700" letter-spacing="-0.03em">-81.5%</text>
      <text x="28" y="130" fill="#6E6E73" font-size="13" font-weight="400">Up to 629k tokens saved per task</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(370, 0)">
      <rect width="340" height="160" rx="18" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="28" y="44" fill="#86868B" font-size="12" font-weight="600" letter-spacing="0.08em">API COST</text>
      <text x="28" y="98" fill="#2997FF" font-size="48" font-weight="700" letter-spacing="-0.03em">-84.1%</text>
      <text x="28" y="130" fill="#6E6E73" font-size="13" font-weight="400">Locked Gemini Context Caching</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(740, 0)">
      <rect width="340" height="160" rx="18" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="28" y="44" fill="#86868B" font-size="12" font-weight="600" letter-spacing="0.08em">SPEEDUP</text>
      <text x="28" y="98" fill="#BF5AF2" font-size="48" font-weight="700" letter-spacing="-0.03em">3.0x</text>
      <text x="28" y="130" fill="#6E6E73" font-size="13" font-weight="400">Zero context re-parsing lag</text>
    </g>
  </g>
</svg>