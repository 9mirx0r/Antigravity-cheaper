<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#070A0E"/>
    </linearGradient>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0055D4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="layerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.cdnfonts.com/css/sf-pro-display');
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "San Francisco", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad3)" rx="24"/>
  <rect width="1280" height="720" fill="none" stroke="#21262D" stroke-width="1.5" rx="24"/>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#BF5AF2" fill-opacity="0.15" stroke="#BF5AF2" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#BF5AF2"/>
    <text x="26" y="18" fill="#BF5AF2" font-size="11" font-weight="600" letter-spacing="1">SYSTEM TOPOLOGY</text>

    <text x="0" y="65" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="-0.8">
      The 4-Layer Context &amp; Cognitive Architecture
    </text>
    <text x="0" y="94" fill="#8B949E" font-size="16" font-weight="400">
      Engineered for deterministic Gemini Context Caching, AST PageRank navigation, and zero-tax memory.
    </text>
  </g>

  <!-- Main Architecture Stack -->
  <g transform="translate(80, 170)">

    <!-- LAYER 1 & 2: Byte-Frozen Prefix Lock -->
    <g transform="translate(0, 0)">
      <rect width="1120" height="150" rx="18" fill="url(#layerGrad1)" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(30, 30)">
        <rect width="210" height="26" rx="13" fill="#0A84FF" fill-opacity="0.2"/>
        <text x="14" y="17" fill="#58A6FF" font-size="12" font-weight="700">LAYER 1 &amp; 2 • FROZEN PREFIX</text>
        <text x="230" y="18" fill="#8B949E" font-size="13">&gt;2,048 Tokens Threshold • 90% Cost Discount • Byte-Invariant Hashing</text>

        <!-- Components -->
        <g transform="translate(0, 45)">
          <rect width="330" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_prefix_lock.py</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Merkle SHA-256 tree &amp; CRLF canonicalizer</text>

          <rect x="350" y="0" width="340" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_memory.py Invariants</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Zero-Tax SQLite FTS5 injected persistent truths</text>

          <rect x="710" y="0" width="350" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">Gemini Context Cache Lock</text>
          <text x="16" y="42" fill="#30D158" font-size="11">94.2% Cache Hit Ratio Verified</text>
        </g>
      </g>
    </g>

    <!-- LAYER 3: Surgical Exploration & Navigation -->
    <g transform="translate(0, 175)">
      <rect width="1120" height="150" rx="18" fill="url(#layerGrad2)" stroke="#30D158" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(30, 30)">
        <rect width="240" height="26" rx="13" fill="#30D158" fill-opacity="0.2"/>
        <text x="14" y="17" fill="#30D158" font-size="12" font-weight="700">LAYER 3 • SURGICAL EXPLORATION</text>
        <text x="260" y="18" fill="#8B949E" font-size="13">AST PageRank • Binary Search Budget • Pre-Tool Sanitizer Interceptor</text>

        <!-- Components -->
        <g transform="translate(0, 45)">
          <rect width="255" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_repomap.py</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Tree-sitter Personalized PageRank</text>

          <rect x="270" y="0" width="255" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_ast.py</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Zero-loss AST structural elision</text>

          <rect x="540" y="0" width="255" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_mcp_server.py</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">FastMCP 4 surgical stdio tools</text>

          <rect x="810" y="0" width="250" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_pack.py &amp; Hooks</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Deduplicating bounded log slicer</text>
        </g>
      </g>
    </g>

    <!-- LAYER 4: Cognitive State Machine & Swarm Engine -->
    <g transform="translate(0, 350)">
      <rect width="1120" height="150" rx="18" fill="url(#layerGrad3)" stroke="#BF5AF2" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(30, 30)">
        <rect width="280" height="26" rx="13" fill="#BF5AF2" fill-opacity="0.2"/>
        <text x="14" y="17" fill="#BF5AF2" font-size="12" font-weight="700">LAYER 4 • COGNITIVE STATE MACHINE</text>
        <text x="300" y="18" fill="#8B949E" font-size="13">Architect → Implementer → Gatekeeper Critic Tri-State Protocol</text>

        <!-- Components -->
        <g transform="translate(0, 45)">
          <rect width="330" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_pipeline.py Decompose</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Contract-isolated swarm manifests</text>

          <rect x="350" y="0" width="340" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">Gatekeeper Critic</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Read-only SHIP / FIX-FIRST / RETHINK</text>

          <rect x="710" y="0" width="350" height="55" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
          <text x="16" y="24" fill="#FFFFFF" font-size="13" font-weight="600">agy_ledger.py Telemetry</text>
          <text x="16" y="42" fill="#8B949E" font-size="11">Cost per accepted outcome accounting</text>
        </g>
      </g>
    </g>

  </g>
</svg>