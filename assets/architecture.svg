<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="560" fill="url(#bg3)" rx="24"/>
  <rect width="1200" height="560" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="24"/>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <rect width="180" height="28" rx="14" fill="rgba(191,90,242,0.12)" stroke="rgba(191,90,242,0.3)" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#BF5AF2"/>
    <text x="26" y="18" fill="#BF5AF2" font-size="11" font-weight="600" letter-spacing="0.06em">SYSTEM TOPOLOGY</text>

    <text x="0" y="60" fill="#FFFFFF" font-size="28" font-weight="700" letter-spacing="-0.02em">The 4-Layer Context &amp; Cognitive Pipeline</text>
    <text x="0" y="82" fill="#86868B" font-size="14" font-weight="400">Engineered to maximize Gemini context caching and eliminate redundant tokens.</text>
  </g>

  <!-- 3 Simple Horizontal Architecture Cards -->
  <g transform="translate(60, 150)">

    <!-- Layer 1 & 2: Prefix Lock -->
    <g transform="translate(0, 0)">
      <rect width="1080" height="110" rx="16" fill="#16161A" stroke="rgba(41,151,255,0.25)" stroke-width="1"/>
      <!-- Label & Desc -->
      <text x="28" y="44" fill="#FFFFFF" font-size="17" font-weight="700">Layer 1 &amp; 2 • Prefix Lock</text>
      <text x="28" y="68" fill="#86868B" font-size="13">Byte-frozen system invariants &gt;2,048 tokens</text>

      <!-- Chips: exactly spaced! -->
      <!-- Chip 1: x=340 -->
      <rect x="340" y="34" width="220" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="356" y="60" fill="#2997FF" font-size="13" font-family="monospace">agy_prefix_lock.py</text>

      <!-- Chip 2: x=580 -->
      <rect x="580" y="34" width="180" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="596" y="60" fill="#2997FF" font-size="13" font-family="monospace">agy_memory.py</text>

      <!-- Badge: x=900 -->
      <rect x="900" y="34" width="155" height="42" rx="10" fill="rgba(41,151,255,0.12)" stroke="rgba(41,151,255,0.25)" stroke-width="1"/>
      <text x="918" y="60" fill="#2997FF" font-size="13" font-weight="600">94.2% Cache Hits</text>
    </g>

    <!-- Layer 3: Surgical Discovery -->
    <g transform="translate(0, 126)">
      <rect width="1080" height="110" rx="16" fill="#16161A" stroke="rgba(48,209,88,0.25)" stroke-width="1"/>
      <!-- Label & Desc -->
      <text x="28" y="44" fill="#FFFFFF" font-size="17" font-weight="700">Layer 3 • Surgical Discovery</text>
      <text x="28" y="68" fill="#86868B" font-size="13">Selective AST navigation within token budget</text>

      <!-- Chip 1: x=340 -->
      <rect x="340" y="34" width="180" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="356" y="60" fill="#30D158" font-size="13" font-family="monospace">agy_repomap.py</text>

      <!-- Chip 2: x=535 -->
      <rect x="535" y="34" width="145" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="551" y="60" fill="#30D158" font-size="13" font-family="monospace">agy_ast.py</text>

      <!-- Chip 3: x=695 -->
      <rect x="695" y="34" width="155" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="711" y="60" fill="#30D158" font-size="13" font-family="monospace">agy_pack.py</text>

      <!-- Badge: x=885 -->
      <rect x="885" y="34" width="170" height="42" rx="10" fill="rgba(48,209,88,0.12)" stroke="rgba(48,209,88,0.25)" stroke-width="1"/>
      <text x="906" y="60" fill="#30D158" font-size="13" font-weight="600">&lt;1,200 Token Map</text>
    </g>

    <!-- Layer 4: State Machine -->
    <g transform="translate(0, 252)">
      <rect width="1080" height="110" rx="16" fill="#16161A" stroke="rgba(191,90,242,0.25)" stroke-width="1"/>
      <!-- Label & Desc -->
      <text x="28" y="44" fill="#FFFFFF" font-size="17" font-weight="700">Layer 4 • State Machine</text>
      <text x="28" y="68" fill="#86868B" font-size="13">Strict verification &amp; swarm orchestration</text>

      <!-- Chip 1: x=340 -->
      <rect x="340" y="34" width="180" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="356" y="60" fill="#BF5AF2" font-size="13" font-family="monospace">agy_pipeline.py</text>

      <!-- Chip 2: x=535 -->
      <rect x="535" y="34" width="175" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="551" y="60" fill="#BF5AF2" font-size="13" font-family="monospace">Gatekeeper Critic</text>

      <!-- Chip 3: x=725 -->
      <rect x="725" y="34" width="165" height="42" rx="10" fill="#202025" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="741" y="60" fill="#BF5AF2" font-size="13" font-family="monospace">agy_ledger.py</text>

      <!-- Badge: x=925 -->
      <rect x="925" y="34" width="130" height="42" rx="10" fill="rgba(191,90,242,0.12)" stroke="rgba(191,90,242,0.25)" stroke-width="1"/>
      <text x="946" y="60" fill="#BF5AF2" font-size="13" font-weight="600">Zero Loss</text>
    </g>

  </g>
</svg>