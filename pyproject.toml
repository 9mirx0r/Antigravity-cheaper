[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-cheaper"
version = "1.0.0"
description = "Token-Efficiency & Cognitive Scaffolding Engine for Google Antigravity and Gemini Agents"
readme = "README.md"
authors = [{ name = "Antigravity Cheaper Team" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["antigravity", "gemini", "token-optimization", "ast", "pagerank", "fastmcp", "context-caching"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
agy-repomap = "antigravity_cheaper.agy_repomap:main"
agy-prefix-lock = "antigravity_cheaper.agy_prefix_lock:main"
agy-memory = "antigravity_cheaper.agy_memory:main"
agy-pipeline = "antigravity_cheaper.agy_pipeline:main"
agy-ast = "antigravity_cheaper.agy_ast:main"
agy-pack = "antigravity_cheaper.agy_pack:main"
agy-capsule = "antigravity_cheaper.agy_capsule:main"
agy-ledger = "antigravity_cheaper.agy_ledger:main"
agy-mcp-server = "antigravity_cheaper.agy_mcp_server:main"
